name: Build FinPulse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Actions tab se manually "Run workflow" bhi chala sakte ho

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: JDK 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Repo mein gradlew / gradle-wrapper.jar nahi hai,
      # isliye Gradle 9.3.1 (wrapper properties wala version) directly install karte hain
      - name: Gradle 9.3.1 setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Android SDK licenses accept
        run: yes | sdkmanager --licenses > /dev/null || true

      # build.gradle.kts ko debug.keystore chahiye (.gitignore mein hai, repo mein nahi)
      - name: Debug keystore generate
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Debug APK build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: FinPulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk